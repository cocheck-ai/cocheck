<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoCheck: review page v2 mock</title>
<!-- Static design mock for the review page v2 build. Content is from a recorded test run. Spec: review-page-v2.md in this folder. -->
<style>
@font-face{font-family:'Atkinson Hyperlegible';font-style:italic;font-weight:400;font-display:swap;src:url(../../src/timeline/rail/assets/fonts/atkinson-italic-400.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(../../src/timeline/rail/assets/fonts/atkinson-normal-400.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(../../src/timeline/rail/assets/fonts/atkinson-normal-700.woff2) format('woff2')}
:root{
  --paper:#f6fafd; --white:#fff;
  --sky:#a8cdeb; --sky-pale:#e4f0f9; --sky-deep:#4f86b0;
  --pink:#f2b6d2; --pink-pale:#fdeef6; --pink-mid:#e79dc2; --pink-deep:#c23b7b;
  --lav:#cdbdf0; --lav-deep:#7d68c4;
  --ink:#1c2740; --ink-soft:#4a5873; --line:rgba(79,134,176,.28);
  --pass:#1f7a3d; --pass-pale:#e3f2e8; --fail:#b3261e; --fail-pale:#fbe9e7;
  --font:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px; --round:999px;
  --rail:288px; --notes:240px;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{font:15px/1.45 var(--font);color:var(--ink);background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px}

/* one rounding: pills and chips are fully round, a chip in a pill is a circle; buttons, panes, cards are 8px */
.chip{flex:none;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:700;line-height:1;color:var(--ink)}
.chip.you{background:var(--ink);color:var(--white)} .chip.claude{background:#6fb0e3} .chip.h1{background:#e0a458} .chip.h2{background:#58b09c}
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border:1.5px solid var(--ink-soft);border-radius:var(--r);background:var(--white);font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sky-pale)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--white)}
.btn.primary:hover:not(:disabled){background:#2c3a5a}
.btn .count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--round);background:var(--fail);color:var(--white);font-size:12px}
.btn .dot{width:8px;height:8px;border-radius:50%;background:var(--pink-deep)}
kbd{font:700 11px/1 var(--font);padding:2px 5px;border:1px solid currentColor;border-radius:4px;opacity:.7}

/* ---------- top bar: the task bar lives here ---------- */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;height:56px;padding:0 20px;background:var(--paper);border-bottom:2px solid var(--sky)}
.wordmark{font-size:22px;font-weight:700;letter-spacing:-.01em}
.task{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.task b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task span{font-size:13px;color:var(--ink-soft)}
.progress{margin-left:auto;display:flex;flex-direction:column;gap:4px;width:220px;font-size:13px;color:var(--ink-soft)}
.progress .bar{height:6px;border-radius:var(--round);background:var(--sky-pale);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--pass);border-radius:var(--round);transition:width .25s}
.taskbtns{display:flex;gap:8px;position:relative}
.notepanel{position:absolute;right:0;top:44px;width:360px;padding:12px;background:var(--white);border:1.5px solid var(--ink-soft);border-radius:var(--r);box-shadow:0 8px 24px rgba(28,39,64,.14)}
.notepanel label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
textarea{width:100%;font:14px/1.4 var(--font);color:var(--ink);padding:8px 10px;border:1.5px solid var(--ink-soft);border-radius:var(--r);resize:vertical;background:var(--white)}
.notepanel .row-end{display:flex;justify-content:flex-end;margin-top:8px}

.body{display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}

/* ---------- rail ---------- */
.railcol{background:var(--sky-pale);border-right:2px solid var(--sky)}
.rail{position:sticky;top:56px;height:calc(100vh - 56px);display:flex;flex-direction:column;padding:12px 6px 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.lg{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 3px;border-radius:var(--round);border:1.5px solid var(--sky-deep);background:var(--white);font-size:12px;font-weight:700}
.lg .chip{width:16px;height:16px;font-size:10px}
.lg:hover{border-color:var(--ink)}
.lg[aria-pressed=false]{background:transparent;border-style:dashed;border-color:rgba(74,88,115,.5);color:var(--ink-soft);font-weight:400}
.lg[aria-pressed=false] .chip{background:transparent;color:var(--ink-soft);box-shadow:inset 0 0 0 1.5px rgba(74,88,115,.5)}
.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;border-top:1px solid var(--line);padding-top:6px;scrollbar-width:thin}
.tl{position:relative}
.tl svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.rw{position:absolute;z-index:1;left:0;right:0;display:flex;align-items:center;border:0;background:none;padding:0 6px 0 var(--lbl);text-align:left;font-size:13px;color:var(--ink-soft)}
.rw .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.rw::before{content:'';position:absolute;left:calc(var(--lbl) - 8px);right:2px;top:2px;bottom:2px;border-radius:var(--r);z-index:-1}
button.rw:hover{color:var(--ink)}
button.rw[aria-current=true]{color:var(--ink);font-weight:700}
button.rw[aria-current=true]::before{background:var(--white);box-shadow:inset 0 0 0 1.5px var(--sky-deep)}
button.rw:focus-visible{outline-offset:-3px;border-radius:var(--r)}
.rw.stop{color:var(--ink)}
.rw.hdr{font-size:12px;font-weight:700;color:var(--ink-soft)}
.rw.hdr .chev{flex:none;width:12px;height:12px;margin:0 4px 0 -2px;transition:transform .15s}
.rw.hdr[aria-expanded=false] .chev{transform:rotate(-90deg)}
.rw.hdr .cnt{flex:none;margin-left:6px;font-weight:400}
.rw.quiet{font-size:12px}
.rw.fgroup .tx{color:var(--ink-soft)}
.rw .vm{flex:none;width:16px;height:16px;border-radius:50%;margin-left:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--white);font-size:11px;font-weight:700;line-height:1}
.rw .vm.pass{background:var(--pass)} .rw .vm.fail{background:var(--fail)}
.rw .vm.inherited{opacity:.55}
.qlist{position:absolute;left:var(--lbl);right:6px;font-size:12px;color:var(--ink-soft)}
.qlist div{height:20px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px;border-left:1.5px solid var(--line)}
.pmark{position:absolute;left:4px;right:4px;height:0;border-top:2px dashed var(--ink-soft)}
.pmark span{position:absolute;right:0;top:-11px;height:20px;padding:0 10px;border-radius:var(--round);background:var(--ink-soft);color:var(--white);font-size:11px;font-weight:700;line-height:20px}

/* ---------- main ---------- */
.main{padding:18px 24px 40px;min-width:0}
.stephead{display:flex;align-items:center;gap:16px;min-height:40px}
.stephead h1{flex:1;min-width:0;display:flex;align-items:center;gap:10px;margin:0;font-size:22px;line-height:1.25}
.stephead h1 .chip{width:24px;height:24px;font-size:13px}
.stephead h1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai{max-width:58em;margin:10px 0 18px;font-size:16px}
.ai .tag{display:inline-block;margin-left:8px;height:20px;padding:0 8px;border-radius:var(--round);background:var(--white);border:1.5px solid var(--ink-soft);color:var(--ink-soft);font-size:12px;font-weight:700;line-height:17px;vertical-align:1px;cursor:help}

/* the verdict control: two real buttons in one group */
.verdict{flex:none;display:flex;align-items:center;gap:10px}
.vgroup{display:flex;border:1.5px solid var(--ink-soft);border-radius:var(--r);overflow:hidden;background:var(--white)}
.vgroup button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border:0;background:var(--white);font-weight:700;font-size:15px}
.vgroup button + button{border-left:1.5px solid var(--ink-soft)}
.vgroup button:hover{background:var(--sky-pale)}
.vgroup button:focus-visible{outline-offset:-4px}
.vgroup button svg{width:16px;height:16px}
.vgroup .vp[aria-pressed=true]{background:var(--pass);color:var(--white)}
.vgroup .vf[aria-pressed=true]{background:var(--fail);color:var(--white)}
.vcover{font-size:13px;color:var(--ink-soft)}
.failnote{max-width:46em;margin:12px 0 0 34px;padding:12px;border:1.5px solid var(--fail);border-radius:var(--r);background:var(--fail-pale)}
.failnote label{display:block;font-weight:700;margin-bottom:6px}
.failnote .acts{display:flex;gap:8px;margin-top:8px;align-items:center}
.failnote .acts span{font-size:13px;color:var(--ink-soft);margin-left:auto}
.failsaved{max-width:46em;margin:10px 0 0 34px;padding:8px 12px;border-left:3px solid var(--fail);font-size:15px}

/* change stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) var(--notes);gap:14px;align-items:start}
.stage.wide{grid-template-columns:minmax(0,1fr)}
.plabel{display:inline-block;margin:0 0 6px;padding:1px 12px;border-radius:var(--round);font-size:14px;font-weight:700}
.plabel.b{background:var(--sky)} .plabel.a{background:var(--pink)}
.pane{background:var(--white);border:2px solid var(--sky);border-radius:var(--r);overflow:hidden}
.pane.after{border-color:var(--pink-mid)}
.tabs{display:flex;gap:4px;padding:5px 6px 0;background:var(--sky-pale);border-bottom:2px solid var(--sky);overflow:hidden}
.after .tabs{border-bottom-color:var(--pink-mid)}
.tab{flex:none;padding:2px 10px;border:1.5px solid var(--sky);border-bottom:0;border-radius:var(--r) var(--r) 0 0;font-size:13px;background:var(--white);color:var(--ink-soft)}
.tab.on{color:var(--ink);font-weight:700;border-color:var(--sky-deep)}
.tab.chg::after{content:'';display:inline-block;width:7px;height:7px;margin-left:6px;border-radius:50%;background:var(--pink-deep);vertical-align:1px}
.grid{border-collapse:collapse;font-size:13px;width:100%;table-layout:fixed}
.grid th{font-weight:400;font-size:11px;color:var(--ink-soft);background:rgba(0,0,0,.03);border:1px solid var(--sky);padding:1px 4px;text-align:center}
.grid td{border:1px solid var(--sky);padding:2px 6px;height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid th.rh{width:30px;text-align:right}
.grid tr.gap td,.grid tr.gap th{height:20px;border-style:dashed;font-size:11px;color:var(--ink-soft);text-align:center;background:var(--paper)}
.after .grid td.hit{background:rgba(242,182,210,.55);box-shadow:inset 0 0 0 2px var(--pink-deep)}
.after .grid tr.hitrow td{background:rgba(242,182,210,.35)}
.before .grid td.hit{box-shadow:inset 0 0 0 2px var(--sky-deep);outline:0;background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(168,205,235,.35) 4px 6px)}
.notes{display:flex;flex-direction:column;gap:8px;margin-top:30px}
.note{display:block;width:100%;text-align:left;padding:8px 12px;border:1.5px solid var(--pink-mid);border-radius:var(--r);background:var(--white);font-size:14px;line-height:1.35}
.note b{display:block;font-size:13px}
.note s{color:var(--ink-soft);text-decoration-color:var(--pink-deep);text-decoration-thickness:2px}
.note[aria-pressed=true]{background:var(--pink-pale);border:2px solid var(--pink-deep);padding:7px 11px}
.note.more{border-style:dashed;color:var(--ink-soft);font-style:italic}
.below{display:flex;align-items:baseline;gap:14px;margin-top:10px;font-size:13px;color:var(--ink-soft)}
.below details{font-size:13px}
.below summary{cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.below details p{margin:6px 0 0;max-width:52em}

/* aligned split text diff: row n left and row n right are the same line */
.diff{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.dpane{background:var(--white);border:2px solid var(--sky);border-radius:var(--r);overflow:hidden}
.dpane.after{border-color:var(--pink-mid)}
.dl{display:grid;grid-template-columns:40px minmax(0,1fr);min-height:24px;font:12.5px/24px var(--mono);border-bottom:1px solid var(--sky-pale)}
.dl .n{text-align:right;padding-right:8px;color:var(--ink-soft);background:rgba(0,0,0,.025);border-right:1px solid var(--sky)}
.dl .c{padding:0 10px;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.dl.void{background:repeating-linear-gradient(135deg,var(--sky-pale) 0 5px,#fff 5px 10px)}
.dl.void .n{background:transparent}
.before .dl.del,.before .dl.edit{background:rgba(168,205,235,.38)}
.before .dl.del .c{text-decoration:line-through;text-decoration-color:var(--sky-deep)}
.after .dl.add,.after .dl.edit{background:rgba(242,182,210,.38)}
.dl .w{border-radius:3px;padding:0 1px}
.before .dl .w{background:rgba(79,134,176,.32);text-decoration:line-through}
.after .dl .w{background:rgba(194,59,123,.25);font-weight:700}
.dl.fold{grid-template-columns:1fr;font:12px/22px var(--font);color:var(--ink-soft);text-align:center;background:var(--paper);border-top:1px dashed var(--sky);border-bottom:1px dashed var(--sky)}

/* request, message, report cards */
.reqtext{max-width:46em;background:var(--sky-pale);border:2px solid var(--sky-deep);border-radius:var(--r);padding:18px 22px;font-size:19px;line-height:1.5;white-space:pre-wrap}
.msg{max-width:46em}
.msg .to{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:14px;color:var(--ink-soft)}
.msg .card{background:var(--white);border:1.5px solid var(--sky);border-left:5px solid var(--lc);border-radius:var(--r);padding:14px 18px;font-size:16px;line-height:1.5}
.msg .card p{margin:0 0 8px} .msg .card p:last-child{margin:0}
.msg .card code{font:13px var(--mono)}
.linkbtn{border:0;background:none;padding:0;color:var(--sky-deep);text-decoration:underline;text-underline-offset:2px;font-size:14px}
h2.sub{font-size:15px;margin:24px 0 8px}
.files{max-width:46em;border:1.5px solid var(--sky);border-radius:var(--r);background:var(--white);overflow:hidden}
.files button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;border:0;border-top:1px solid var(--sky-pale);background:none;text-align:left;font-size:15px}
.files button:first-child{border-top:0}
.files button:hover{background:var(--sky-pale)}
.files .fn{flex:1;min-width:0;font-weight:700}
.files .fx{color:var(--ink-soft);font-size:13px}
.st{flex:none;font-size:13px;font-weight:700;padding:1px 10px;border-radius:var(--round);border:1.5px solid var(--ink-soft);color:var(--ink-soft)}
.st.pass{border-color:var(--pass);color:var(--pass);background:var(--pass-pale)}
.st.fail{border-color:var(--fail);color:var(--fail);background:var(--fail-pale)}

/* failure group */
.fails{max-width:52em;border:1.5px solid var(--sky);border-radius:var(--r);background:var(--white);overflow:hidden}
.fr{padding:12px 16px;border-top:1px solid var(--sky-pale)}
.fr:first-child{border-top:0}
.fr .what{font-weight:700}
.fr .err{margin:2px 0 0;font:13px/1.4 var(--mono);color:var(--ink-soft)}
.fr pre{margin:8px 0 0;padding:8px 10px;max-height:200px;overflow:auto;background:var(--paper);border:1px solid var(--sky);border-radius:var(--r);font:12px/1.4 var(--mono);white-space:pre-wrap}

.placeholder{max-width:46em;padding:16px 18px;border:1.5px dashed var(--sky-deep);border-radius:var(--r);color:var(--ink-soft)}

/* undo bar */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 12px 10px 16px;border-radius:var(--r);background:var(--ink);color:var(--white);font-size:14px;box-shadow:0 8px 24px rgba(28,39,64,.25);z-index:30}
.toast button{height:28px;padding:0 10px;border:1.5px solid var(--white);border-radius:var(--r);background:transparent;color:var(--white);font-weight:700;font-size:13px}
dialog{max-width:30em;border:1.5px solid var(--ink-soft);border-radius:var(--r);padding:20px 22px;color:var(--ink);font-family:var(--font)}
dialog::backdrop{background:rgba(28,39,64,.35)}
dialog h2{margin:0 0 8px;font-size:18px}
dialog p{margin:0 0 16px}
dialog .acts{display:flex;justify-content:flex-end;gap:8px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wordmark">CoCheck</div>
  <div class="task"><b>FRED macro data export</b><span>work</span></div>
  <div class="progress" aria-live="polite"><span id="progtext"></span><div class="bar"><i id="progbar"></i></div></div>
  <div class="taskbtns">
    <button class="btn" id="notebtn" aria-expanded="false" aria-controls="notepanel">Note<span class="dot" id="notedot" hidden></span></button>
    <button class="btn" id="sendback" disabled>Send back<span class="count" id="failcount" hidden></span></button>
    <button class="btn primary" id="submit">Submit</button>
    <div class="notepanel" id="notepanel" hidden>
      <label for="overall">Note on the whole task</label>
      <textarea id="overall" rows="4"></textarea>
      <div class="row-end"><button class="btn" id="noteclose">Done</button></div>
    </div>
  </div>
</header>

<div class="body">
  <aside class="railcol"><nav class="rail" aria-label="What happened, in order">
    <div class="legend" id="legend" role="group" aria-label="Show or hide an actor"></div>
    <div class="scroller" id="scroller"><div class="tl" id="tl"></div></div>
  </nav></aside>
  <main class="main" id="main" aria-live="polite"></main>
</div>

<div class="toast" id="toast" role="status" hidden><span id="toasttext"></span><button id="undo">Undo <kbd>U</kbd></button></div>
<dialog id="subdlg" aria-labelledby="subt">
  <h2 id="subt">Submit with changes unreviewed?</h2>
  <p id="subp"></p>
  <div class="acts"><button class="btn" id="subcancel">Keep reviewing</button><button class="btn primary" id="subgo">Submit</button></div>
</dialog>

<script>
(function () {
'use strict';
var LANES = { you: { x: 16, color: '#1c2740', chip: 'Y', cls: 'you', name: 'You' },
  claude: { x: 34, color: '#6fb0e3', chip: 'C', cls: 'claude', name: 'Claude' },
  h1: { x: 52, color: '#e0a458', chip: '1', cls: 'h1', name: 'Helper 1' },
  h2: { x: 70, color: '#58b09c', chip: '2', cls: 'h2', name: 'Helper 2' } };
var LBL = 90;
var H = { origin: 18, stop: 30, request: 30, fgroup: 30, reply: 30, finish: 30, hdr: 26, quiet: 22, pmark: 26 };

/* the rail, in the recorded run's order. type decides the slot; every row has its own height and nothing sits between rows */
var ROWS = [
  { id: 'o', type: 'origin' },
  { id: 'r1', type: 'request', lane: 'you', text: 'Your request 1' },
  { id: 'f1', type: 'fgroup', lane: 'claude', text: '1 run failed' },
  { id: 'c2', type: 'stop', lane: 'claude', text: 'Created fetch_fred.py', file: 'macro/fetch_fred.py', v: 'pass' },
  { id: 'f2', type: 'fgroup', lane: 'claude', text: '2 runs failed' },
  { id: 'c3', type: 'stop', lane: 'claude', text: 'Changed fetch_fred.py', file: 'macro/fetch_fred.py', v: 'pass' },
  { id: 'h1', type: 'hdr', lane: 'claude', text: 'Rerun FRED fetch', v: 'pass', covers: ['c4', 'c7', 'c5', 'c8', 'c6', 'c9'] },
  { id: 'c4', type: 'stop', lane: 'claude', text: 'Created gdp.csv', file: 'macro/data/gdp.csv', under: 'h1' },
  { id: 'c7', type: 'stop', lane: 'claude', text: 'Created unemployment.csv', file: 'macro/data/unemployment.csv', under: 'h1' },
  { id: 'c5', type: 'stop', lane: 'claude', text: 'Created inflation.csv', file: 'macro/data/inflation.csv', under: 'h1' },
  { id: 'c8', type: 'stop', lane: 'claude', text: 'Created usd.csv', file: 'macro/data/usd.csv', under: 'h1' },
  { id: 'c6', type: 'stop', lane: 'claude', text: 'Created macro.xlsx', file: 'macro/data/macro.xlsx', under: 'h1' },
  { id: 'c9', type: 'stop', lane: 'claude', text: 'Changed macro.xlsx', file: 'macro/data/macro.xlsx', under: 'h1' },

  var h = '<table class="grid"><colgroup><col style="width:30px">' + w.map(function (x) { return '<col style="width:' + x + '%">'; }).join('') + '</colgroup><tr><th class="rh"></th>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr>';
  rows.forEach(function (r) {
    if (r[0] === 'gap') { h += '<tr class="gap"><th class="rh"></th><td colspan="6">' + r[1] + '</td></tr>'; return; }
    var hitrow = after && (r[0] === 6 || r[0] === 7);
    h += '<tr' + (hitrow ? ' class="hitrow"' : '') + '><th class="rh">' + r[0] + '</th>' + r[1].map(function (v, i) {
      var hit = r[0] === 1 && i === 1;
      return '<td' + (hit ? ' class="hit"' : '') + ' title="' + esc(v) + '">' + esc(v) + '</td>';
    }).join('') + '</tr>';
  });
  return h + '</table>';
}
/* c18 from the recorded run, aligned: [kind, before n, before text, after n, after text]. kind: same, add, del, edit, fold */
var DIFF = [
  ['same', 6, 'Run: python fetch_fred.py  (requires pandas, openpyxl, requests)', 6, 'Run: python fetch_fred.py  (requires pandas, openpyxl, requests)'],
  ['same', 7, '"""', 7, '"""'],
  ['add', null, '', 8, 'import time'],
  ['same', 8, 'from datetime import date', 9, 'from datetime import date'],
  ['same', 9, 'from io import StringIO', 10, 'from io import StringIO'],
  ['fold', '31 unchanged lines'],
  ['same', 41, '    url = f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}"', 42, '    url = f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}"'],
  ['same', 42, '    # Yahoo rejects requests without a browser UA (FRED is the opposite)', 43, '    # Yahoo rejects requests without a browser UA (FRED is the opposite)'],
  ['add', null, '', 44, '    # explicit period1/period2: range=max silently downsamples to monthly bars'],
  ['add', null, '', 45, '    params = {"period1": -1_500_000_000, "period2": int(time.time()), "interval": "1d"}'],
  ['edit', 43, ['    r = requests.get(url, params=', '{"range": "max", "interval": "1d"}', ', timeout=60,'], 46, ['    r = requests.get(url, params=', 'params', ', timeout=60,']],
  ['same', 44, '                     headers={"User-Agent": "Mozilla/5.0"})', 47, '                     headers={"User-Agent": "Mozilla/5.0"})'],
  ['same', 45, '    r.raise_for_status()', 48, '    r.raise_for_status()'],
  ['fold', '2 unchanged lines'],
  ['same', 48, '    dates = pd.to_datetime(res["timestamp"], unit="s", utc=True).tz_convert(tz).normalize().tz_localize(None)', 51, '    dates = pd.to_datetime(res["timestamp"], unit="s", utc=True).tz_convert(tz).normalize().tz_localize(None)'],
  ['same', 49, '    df = pd.DataFrame({"date": dates, symbol: res["indicators"]["quote"][0]["close"]})', 52, '    df = pd.DataFrame({"date": dates, symbol: res["indicators"]["quote"][0]["close"]})'],
  ['add', null, '', 53, '    df[symbol] = df[symbol].round(2)'],
  ['same', 50, '    return df.dropna().drop_duplicates("date", keep="last")', 54, '    return df.dropna().drop_duplicates("date", keep="last")']
];
function diffSide(side) {
  return DIFF.map(function (d) {
    if (d[0] === 'fold') return '<div class="dl fold">' + esc(d[1]) + '</div>';
    var n = side === 'b' ? d[1] : d[3], t = side === 'b' ? d[2] : d[4];
    if (n === null) return '<div class="dl void" aria-label="no line"><span class="n"></span><span class="c"></span></div>';
    var txt = Array.isArray(t) ? esc(t[0]) + '<span class="w">' + esc(t[1]) + '</span>' + esc(t[2]) : esc(t);
    return '<div class="dl ' + d[0] + '"><span class="n">' + n + '</span><span class="c">' + txt + '</span></div>';
  }).join('');
}

function render() {
  var r = BY[cur], m = document.getElementById('main'), html;
  if (STEPS[r.id]) html = STEPS[r.id](r);
  else if (r.type === 'hdr') html = STEPS.hdr(r);
  else {
    var t = r.type === 'request' ? r.text : r.type === 'stop' ? LANES[r.lane].name + ' ' + r.text.charAt(0).toLowerCase() + r.text.slice(1) : r.text;
    html = head(r, r.lane, t) + failBlock(r) + '<div class="placeholder">This mock draws seven example steps: your request 3, “2 runs failed”, the calls under “Pull both S&P series”, macro.xlsx under it, fetch_fred.py under “Re-pull S&P”, Helper 2’s finish, and Claude’s note to Helper 1.</div>';
  }
  m.innerHTML = html;
  m.querySelectorAll('[data-go]').forEach(function (b) { b.addEventListener('click', function () { go(b.dataset.go); }); });
  var vp = m.querySelector('.vp'), vf = m.querySelector('.vf');
  if (vp) vp.addEventListener('click', function () { setVerdict(r.id, own(r) === 'pass' ? null : 'pass', true); });
  if (vf) vf.addEventListener('click', function () { if (own(r) === 'fail') setVerdict(r.id, null); else startFail(r.id); });
  m.querySelectorAll('.note').forEach(function (n) { n.addEventListener('click', function () { m.querySelectorAll('.note').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); }); n.setAttribute('aria-pressed', 'true'); }); });
  var fn = document.getElementById('fnote');
  if (fn) {
    fn.focus();
    fn.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveFail(); } else if (e.key === 'Escape') { failing = null; render(); } });
    document.getElementById('fsave').addEventListener('click', saveFail);
    document.getElementById('fcancel').addEventListener('click', function () { failing = null; render(); });
  }
}
/* the header row is the control: a click (or Enter, Space) opens or closes it and selects it; Right opens, Left closes */
function toggleHdr(h, open) {
  hdrOpen[h.id] = open;
  if (!open && h.covers.indexOf(cur) >= 0) cur = h.id;
  go(h.id);
}
function selectable(r) { return r.type !== 'origin' && r.type !== 'pmark' && r.type !== 'quiet' && shown(r); }
function nearestShown(id) {
  var i = BY[id].i;
  for (var k = 1; k < ROWS.length; k++) { var a = ROWS[i + k], b = ROWS[i - k]; if (a && selectable(a)) return a.id; if (b && selectable(b)) return b.id; }
  return id;
}
function buildLegend() {
  var lg = document.getElementById('legend'); lg.innerHTML = '';
  Object.keys(LANES).forEach(function (k) {
    var a = LANES[k], off = !!hiddenLanes[k], b = document.createElement('button');
    b.className = 'lg'; b.type = 'button'; b.dataset.lane = k; b.setAttribute('aria-pressed', String(!off)); b.title = (off ? 'Show ' : 'Hide ') + a.name;
    b.innerHTML = '<span class="chip ' + a.cls + '" aria-hidden="true">' + a.chip + '</span>' + esc(a.name);
    b.addEventListener('click', function () { toggleLane(k); });
    lg.appendChild(b);
  });
}
function toggleLane(k) {
  if (!hiddenLanes[k] && Object.keys(LANES).filter(function (x) { return !hiddenLanes[x] && x !== k; }).length < 1) return;
  hiddenLanes[k] = !hiddenLanes[k];
  if (!shown(BY[cur])) cur = nearestShown(cur);
  buildLegend(); drawRail(); render();
  var b = document.querySelector('.lg[data-lane="' + k + '"]'); if (b) b.focus();
}
/* the rail is redrawn on every move, so a row that had keyboard focus hands it to the new current row */
function go(id) {
  if (!BY[id] || !selectable(BY[id])) return;
  var ae = document.activeElement, refocus = !!(ae && ae.classList && ae.classList.contains('rw'));
  cur = id; failing = null; drawRail(); render();
  var b = document.querySelector('.rw[data-id="' + id + '"]'); if (b) { b.scrollIntoView({ block: 'nearest' }); if (refocus) b.focus(); }
}

/* ---------- verdicts, undo, task bar ---------- */
var last = null, toastTimer = null;
function setVerdict(id, v, advance) {
  last = { id: id, prev: own(BY[id]) || null, prevNote: notes[id] };
  if (v) verdicts[id] = v; else delete verdicts[id];
  if (v !== 'fail') delete notes[id];
  failing = null; updateBar();
  var r = BY[id], name = r.type === 'hdr' ? 'the ' + r.covers.length + ' files under “' + r.text + '”' : r.text.replace(/^(Created|Changed) /, '');
  toast(v ? (v === 'pass' ? 'Passed ' : 'Failed ') + name + '.' : 'Cleared the verdict on ' + name + '.');
  if (advance && v === 'pass') { var nx = nextNeeding(id); if (nx) { go(nx); return; } }
  drawRail(); render();
}
function startFail(id) { failing = id; render(); }
function saveFail() { var t = document.getElementById('fnote').value.trim(); if (!t) { document.getElementById('fnote').focus(); return; } var id = failing; notes[id] = t; setVerdict(id, 'fail'); notes[id] = t; render(); }
function nextNeeding(from) {
  for (var i = BY[from].i + 1; i < ROWS.length; i++) { var r = ROWS[i]; if (hiddenLanes[r.lane]) continue; if (reviewable(r) && !eff(r) && !(r.type === 'hdr' && r.covers.every(function (c) { return eff(BY[c]); }))) return r.id; }
  return null;
}
function toast(text) {
  var t = document.getElementById('toast'); document.getElementById('toasttext').textContent = text; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 6000);
}
function undo() {
  if (!last) return; var l = last; last = null;
  if (l.prev) verdicts[l.id] = l.prev; else delete verdicts[l.id];
  if (l.prevNote) notes[l.id] = l.prevNote; else delete notes[l.id];
  document.getElementById('toast').hidden = true; updateBar(); cur = l.id;
  if (!shown(BY[cur])) cur = BY[cur].under && shown(BY[BY[cur].under]) ? BY[cur].under : nearestShown(cur);
  drawRail(); render();
}
function updateBar() {
  var done = changes().filter(function (r) { return eff(r); }).length;
  document.getElementById('progtext').textContent = done + ' of ' + TOTAL + ' changes reviewed';
  document.getElementById('progbar').style.width = (100 * done / TOTAL) + '%';
  var fails = changes().filter(function (r) { return eff(r) === 'fail'; }).length;
  var fc = document.getElementById('failcount'); fc.hidden = !fails; fc.textContent = fails;
  var noted = document.getElementById('overall').value.trim() !== '';
  document.getElementById('notedot').hidden = !noted;
  document.getElementById('sendback').disabled = !(fails || noted);
}
document.getElementById('undo').addEventListener('click', undo);
document.getElementById('notebtn').addEventListener('click', function () { var p = document.getElementById('notepanel'), o = p.hidden; p.hidden = !o; this.setAttribute('aria-expanded', String(o)); if (o) document.getElementById('overall').focus(); });
document.getElementById('noteclose').addEventListener('click', function () { document.getElementById('notepanel').hidden = true; document.getElementById('notebtn').setAttribute('aria-expanded', 'false'); document.getElementById('notebtn').focus(); });
document.getElementById('overall').addEventListener('input', updateBar);
document.getElementById('submit').addEventListener('click', function () {
  var left = TOTAL - (changes().filter(function (r) { return eff(r); }).length);
  if (!left) return;
  document.getElementById('subp').textContent = left + ' of ' + TOTAL + ' changes have no verdict yet. Submitting records them as not reviewed.';
  document.getElementById('subdlg').showModal();
});
document.getElementById('subcancel').addEventListener('click', function () { document.getElementById('subdlg').close(); });
document.getElementById('subgo').addEventListener('click', function () { document.getElementById('subdlg').close(); });

/* keys: P pass and move on, F fail, U undo, arrows step. A field that takes typing keeps every key. */
addEventListener('keydown', function (e) {
  var t = e.target; if (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  var r = BY[cur], k = e.key.toLowerCase();
  if (k === 'p' && reviewable(r)) { setVerdict(r.id, 'pass', true); e.preventDefault(); }
  else if (k === 'f' && reviewable(r)) { startFail(r.id); e.preventDefault(); }
  else if (k === 'u') { undo(); e.preventDefault(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    var d = e.key === 'ArrowDown' ? 1 : -1;
    for (var i = r.i + d; i >= 0 && i < ROWS.length; i += d) { if (selectable(ROWS[i])) { go(ROWS[i].id); break; } }
    e.preventDefault();
  }
  else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && r.type === 'hdr') { toggleHdr(r, e.key === 'ArrowRight'); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' && r.under) { toggleHdr(BY[r.under], false); e.preventDefault(); }
});

updateBar(); buildLegend(); drawRail(); render();
})();
</script>
